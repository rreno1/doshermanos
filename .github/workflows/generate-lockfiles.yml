name: Generate lockfiles

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate npm lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: chore/reproducible-dependencies

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate web lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate Firestore test lockfile
        working-directory: firebase/tests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json mobile/package-lock.json firebase/tests/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "chore: lock npm dependencies"
          git push origin HEAD:chore/reproducible-dependencies
