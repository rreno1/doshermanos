name: Generate lockfiles

on:
  push:
    branches: [chore/reproducible-dependencies]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate npm lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate web lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate Firestore test lockfile
        working-directory: firebase/tests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: generated-lockfiles
          path: |
            web/package-lock.json
            mobile/package-lock.json
            firebase/tests/package-lock.json
          if-no-files-found: error
          retention-days: 1
