name: Apply equipment rejection test fix

on:
  push:
    branches: [feature/reservation-review-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply equipment regression update
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reservation-review-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply regression update
        run: python scripts/fix-equipment-rejection-test.py

      - name: Remove temporary automation files
        run: |
          rm scripts/fix-equipment-rejection-test.py
          rm .github/workflows/apply-equipment-rejection-test-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: preserve rejected-reservation equipment regression"
          git push origin HEAD:feature/reservation-review-foundation
