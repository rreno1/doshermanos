name: Apply customization rules patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/package-customization-foundation
      - name: Patch Firestore rules and rule tests
        run: |
          python - <<'PY'
          from pathlib import Path

          rules_path = Path('firebase/firestore.rules')
          rules = rules_path.read_text()
          if 'function validReservationCustomization()' not in rules:
              marker = "    function validReservationDocument() {\n"
              addition = """    function validReservationCustomization() {
      return !request.resource.data.keys().hasAll(['customization'])
        || (
          request.resource.data.customization is map
          && request.resource.data.customization.keys().hasOnly([
            'menuRequest', 'foodQuantityRequest', 'supplyRequest'
          ])
          && request.resource.data.customization.keys().hasAll([
            'menuRequest', 'foodQuantityRequest', 'supplyRequest'
          ])
          && request.resource.data.customization.menuRequest is string
          && request.resource.data.customization.menuRequest.size() <= 1000
          && request.resource.data.customization.foodQuantityRequest is string
          && request.resource.data.customization.foodQuantityRequest.size() <= 1000
          && request.resource.data.customization.supplyRequest is string
          && request.resource.data.customization.supplyRequest.size() <= 1000
        );
    }

    function validReservationDocument() {
"""
              rules = rules.replace(marker, addition, 1)
              rules = rules.replace(
                  "          'customerId', 'status', 'event', 'package', 'createdAt', 'updatedAt'\n",
                  "          'customerId', 'status', 'event', 'package', 'customization',\n          'createdAt', 'updatedAt'\n",
                  1,
              )
              rules = rules.replace(
                  "        && validReservationEvent()\n        && validReservationPackage()\n        && request.resource.data.createdAt is timestamp\n",
                  "        && validReservationEvent()\n        && validReservationPackage()\n        && validReservationCustomization()\n        && request.resource.data.createdAt is timestamp\n",
                  1,
              )
              rules_path.write_text(rules)

          test_path = Path('firebase/tests/reservations.rules.test.mjs')
          tests = test_path.read_text()
          if 'customer can submit bounded package customization requests' not in tests:
              tests = tests.replace(
                  """    package: {
      packageId: options.packageId ?? 'active-package',
      packageName: options.packageName ?? 'Active Package',
      priceInCentavos: options.priceInCentavos ?? 250000,
    },
    createdAt: serverTimestamp(),
""",
                  """    package: {
      packageId: options.packageId ?? 'active-package',
      packageName: options.packageName ?? 'Active Package',
      priceInCentavos: options.priceInCentavos ?? 250000,
    },
    customization: options.customization ?? {
      menuRequest: '',
      foodQuantityRequest: '',
      supplyRequest: '',
    },
    createdAt: serverTimestamp(),
""",
                  1,
              )
              tests += """

test('customer can submit bounded package customization requests', async () => {
  const database = testEnvironment.authenticatedContext('customer-a').firestore();
  await assertSucceeds(
    setDoc(doc(database, 'reservations', 'customized-request'), reservationRequest('customer-a', {
      customization: {
        menuRequest: 'Chicken and fish',
        foodQuantityRequest: 'Additional servings for 10 guests',
        supplyRequest: 'Extra serving trays',
      },
    })),
  );
});

test('customization requests are bounded and cannot carry a client-approved total', async () => {
  const database = testEnvironment.authenticatedContext('customer-a').firestore();
  await assertFails(
    setDoc(doc(database, 'reservations', 'oversized-customization'), reservationRequest('customer-a', {
      customization: {
        menuRequest: 'x'.repeat(1001),
        foodQuantityRequest: '',
        supplyRequest: '',
      },
    })),
  );
  await assertFails(
    setDoc(doc(database, 'reservations', 'forged-custom-price'), reservationRequest('customer-a', {
      customization: {
        menuRequest: '',
        foodQuantityRequest: '',
        supplyRequest: '',
        totalPriceInCentavos: 1,
      },
    })),
  );
});
"""
              test_path.write_text(tests)

          Path('.github/workflows/_apply-customization-rules.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: protect reservation customization requests"
          git push origin HEAD:feature/package-customization-foundation
