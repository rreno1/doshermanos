name: Apply customization rules patch

on:
  push:
    branches: [feature/package-customization-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/package-customization-foundation
      - name: Patch Firestore rules and rule tests
        run: |
          python - <<'PY'
          from pathlib import Path

          rules_path = Path('firebase/firestore.rules')
          rules = rules_path.read_text()

          marker = 'function validReservationCustomization()'
          if marker not in rules:
              package_function_end = """    function validReservationDocument() {
"""
              customization_function = """    function validReservationCustomization() {
      return !request.resource.data.keys().hasAll(['customization'])
        || (
          request.resource.data.customization is map
          && request.resource.data.customization.keys().hasOnly([
            'menuRequest', 'foodQuantityRequest', 'supplyRequest'
          ])
          && request.resource.data.customization.keys().hasAll([
            'menuRequest', 'foodQuantityRequest', 'supplyRequest'
          ])
          && request.resource.data.customization.menuRequest is string
          && request.resource.data.customization.menuRequest.size() <= 1000
          && request.resource.data.customization.foodQuantityRequest is string
          && request.resource.data.customization.foodQuantityRequest.size() <= 1000
          && request.resource.data.customization.supplyRequest is string
          && request.resource.data.customization.supplyRequest.size() <= 1000
        );
    }

    function validReservationDocument() {
"""
              if package_function_end not in rules:
                  raise SystemExit('validReservationDocument marker not found')
              rules = rules.replace(package_function_end, customization_function, 1)

              old_only = """          'customerId', 'status', 'event', 'package', 'createdAt', 'updatedAt'
"""
              new_only = """          'customerId', 'status', 'event', 'package', 'customization',
          'createdAt', 'updatedAt'
"""
              if old_only not in rules:
                  raise SystemExit('reservation top-level key list not found')
              rules = rules.replace(old_only, new_only, 1)

              old_validation = """        && validReservationEvent()
        && validReservationPackage()
        && request.resource.data.createdAt is timestamp
"""
              new_validation = """        && validReservationEvent()
        && validReservationPackage()
        && validReservationCustomization()
        && request.resource.data.createdAt is timestamp
"""
              if old_validation not in rules:
                  raise SystemExit('reservation validation block not found')
              rules = rules.replace(old_validation, new_validation, 1)
              rules_path.write_text(rules)

          test_path = Path('firebase/tests/reservations.rules.test.mjs')
          tests = test_path.read_text()
          if 'customer can submit bounded package customization requests' not in tests:
              old_snapshot = """    package: {
      packageId: options.packageId ?? 'active-package',
      packageName: options.packageName ?? 'Active Package',
      priceInCentavos: options.priceInCentavos ?? 250000,
    },
    createdAt: serverTimestamp(),
"""
              new_snapshot = """    package: {
      packageId: options.packageId ?? 'active-package',
      packageName: options.packageName ?? 'Active Package',
      priceInCentavos: options.priceInCentavos ?? 250000,
    },
    customization: options.customization ?? {
      menuRequest: '',
      foodQuantityRequest: '',
      supplyRequest: '',
    },
    createdAt: serverTimestamp(),
"""
              if old_snapshot not in tests:
                  raise SystemExit('reservation test snapshot helper not found')
              tests = tests.replace(old_snapshot, new_snapshot, 1)
              tests += """

test('customer can submit bounded package customization requests', async () => {
  const database = testEnvironment.authenticatedContext('customer-a').firestore();
  await assertSucceeds(
    setDoc(
      doc(database, 'reservations', 'customized-request'),
      reservationRequest('customer-a', {
        customization: {
          menuRequest: 'Chicken and fish',
          foodQuantityRequest: 'Additional servings for 10 guests',
          supplyRequest: 'Extra serving trays',
        },
      }),
    ),
  );
});

test('customization requests are bounded and cannot carry a client-approved total', async () => {
  const database = testEnvironment.authenticatedContext('customer-a').firestore();

  await assertFails(
    setDoc(
      doc(database, 'reservations', 'oversized-customization'),
      reservationRequest('customer-a', {
        customization: {
          menuRequest: 'x'.repeat(1001),
          foodQuantityRequest: '',
          supplyRequest: '',
        },
      }),
    ),
  );

  await assertFails(
    setDoc(
      doc(database, 'reservations', 'forged-custom-price'),
      reservationRequest('customer-a', {
        customization: {
          menuRequest: '',
          foodQuantityRequest: '',
          supplyRequest: '',
          totalPriceInCentavos: 1,
        },
      }),
    ),
  );
});
"""
              test_path.write_text(tests)

          Path('.github/workflows/_apply-customization-rules.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: protect reservation customization requests"
          git push origin HEAD:feature/package-customization-foundation
