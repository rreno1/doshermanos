name: Apply reservation review foundation

on:
  push:
    branches: [feature/reservation-review-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply reservation review changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reservation-review-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused source changes
        run: python scripts/apply-reservation-review-foundation.py

      - name: Remove temporary automation files
        run: |
          rm scripts/apply-reservation-review-foundation.py
          rm .github/workflows/apply-reservation-review-foundation.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add protected reservation review foundation"
          git push origin HEAD:feature/reservation-review-foundation
